<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Greenline Account</title><style>:root{--bg:#07110f;--p:#10251e;--line:#2b5947;--text:#e8f4ed;--muted:#9ab8aa;--a:#63d39b;--w:#f4c96b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07110f,#102a20);color:var(--text);font:14px system-ui;padding:16px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{color:var(--a);text-transform:uppercase;letter-spacing:.12em;font-size:11px}.title{font-size:26px;font-weight:800}.muted{color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;margin:18px 0}button{border:1px solid var(--line);background:#11271f;color:var(--text);padding:10px 13px;border-radius:10px}button.on,button.primary{background:var(--a);color:#062015;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#10251e;border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.big{font-size:25px;color:#b9f3d2;font-weight:800}.section{color:var(--a);letter-spacing:.08em;font-size:12px;margin:14px 0 8px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #23483b}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#183e2b;color:#8df0b7}.warn{background:#493c1e;color:#f7d788}.notice{border-left:3px solid var(--w);padding:10px;background:#211d12;color:#f1d996;border-radius:8px}form{display:grid;gap:10px}input,textarea{width:100%;padding:11px;background:#081712;color:var(--text);border:1px solid var(--line);border-radius:9px}textarea{min-height:80px}@media(max-width:600px){body{padding:12px}.title{font-size:22px}nav button{white-space:nowrap}}</style></head><body><div class="wrap"><header class="top"><div><div class="eyebrow">Client access portal</div><div class="title">Greenline Account</div><div class="muted">Information only · no product checkout</div></div><span class="badge">Account active</span></header><nav id="nav"></nav><main id="app"></main></div><script>const K='mcs_client';let d=JSON.parse(localStorage.getItem(K)||'null')||{balance:0,status:'Pending review',menu:[['CBD 10:10 10ml','Medical information','Available'],['Dried flower 2g','Medical information','Sold out']],history:[],topups:[],reviews:[],terms:false,privacy:false};let tab='Balance';const tabs=['Balance','Availability','History & Reviews','Account'];function save(){localStorage.setItem(K,JSON.stringify(d));render()}function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${tab===x?'on':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}function render(){nav();let v=document.querySelector('#app');if(tab==='Balance')v.innerHTML=`<div class="grid"><div class="card"><div class="muted">AVAILABLE ACCOUNT BALANCE</div><div class="big">R ${Number(d.balance).toFixed(2)}</div></div><div class="card"><div class="muted">MINIMUM TOP-UP</div><div class="big">R 50.00</div><div class="muted">Account access requirement</div></div><div class="card"><div class="muted">ACCOUNT STATUS</div><div class="big">${d.status}</div></div></div><div class="card"><div class="section">ADD TO ACCOUNT</div><div class="notice">This records a donation/top-up request. It is not a product purchase or payment checkout.</div><form id="top"><input name="amount" type="number" min="50" placeholder="Amount (minimum R50)" required><input name="note" maxlength="120" placeholder="Reference / note"><button class="primary">Submit top-up record</button></form><p id="msg"></p></div>`;else if(tab==='Availability')v.innerHTML=`<div class="card"><h3>Current availability</h3><p class="muted">Products are not sold through this app.</p>${d.menu.map(x=>`<div class="row"><span><b>${x[0]}</b><br><span class="muted">${x[1]}</span></span><span class="badge ${x[2]==='Available'?'':'warn'}">${x[2].toUpperCase()}</span></div>`).join('')}</div>`;else if(tab==='History & Reviews')v.innerHTML=`<div class="card"><h3>Account history</h3>${d.history.length?d.history.map(x=>`<div class="row"><span>${x[0]}<br><span class="muted">${x[1]}</span></span><span>${x[2]||''}</span></div>`).join(''):'<p class="muted">No history yet.</p>'}</div><div class="card"><h3>Leave a review</h3><form id="review"><select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea name="text" maxlength="500" placeholder="Your feedback" required></textarea><button class="primary">Save review</button></form></div>`;else v.innerHTML=`<div class="card"><h3>Account & consent</h3><div class="row"><span>Identity verification</span><span class="badge warn">OWNER REVIEW</span></div><div class="row"><span>Privacy notice</span><span class="badge ${d.privacy?'':'warn'}">${d.privacy?'ACKNOWLEDGED':'ACTION NEEDED'}</span></div><div class="row"><span>Terms and conditions</span><span class="badge ${d.terms?'':'warn'}">${d.terms?'ACCEPTED':'ACTION NEEDED'}</span></div><div class="notice">This portal does not determine medical eligibility, dispense products, or replace professional advice.</div></div>`;bind()}function bind(){let f=document.querySelector('#top');if(f)f.onsubmit=e=>{e.preventDefault();let x=new FormData(f),a=+x.get('amount');if(a<50)return alert('Minimum amount is R50');d.topups.push([new Date().toISOString(),a,x.get('note')]);document.querySelector('#msg').innerHTML='<span class="badge">Top-up record saved for review.</span>';f.reset();save()};let r=document.querySelector('#review');if(r)r.onsubmit=e=>{e.preventDefault();let x=new FormData(r);d.reviews.push([x.get('rating'),x.get('text'),new Date().toLocaleDateString()]);r.reset();save();alert('Review saved on this device')}}render();</script></body></html>
