<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Owner Operations Console</title><style>:root{--bg:#07110f;--p:#10251e;--line:#2b5947;--text:#e8f4ed;--muted:#9ab8aa;--a:#63d39b;--w:#f4c96b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07110f,#102a20);color:var(--text);font:14px system-ui;padding:16px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.icon{font-size:26px}.eyebrow{color:var(--a);text-transform:uppercase;letter-spacing:.12em;font-size:11px}.title{font-size:24px;font-weight:800}.muted{color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;margin:18px 0}button{border:1px solid var(--line);background:#11271f;color:var(--text);padding:10px 13px;border-radius:10px}button.on,button.primary{background:var(--a);color:#062015;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#10251e;border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.big{font-size:25px;color:#b9f3d2;font-weight:800}.section{color:var(--a);letter-spacing:.08em;font-size:12px;margin:14px 0 8px}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:10px;border-bottom:1px solid #23483b}input,select{width:100%;padding:11px;background:#081712;color:var(--text);border:1px solid var(--line);border-radius:9px}form{display:grid;gap:10px}.scroll{overflow:auto}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#183e2b;color:#8df0b7}.warn{background:#493c1e;color:#f7d788}@media(max-width:600px){body{padding:12px}.title{font-size:20px}nav button{white-space:nowrap}}</style></head><body><div class="wrap"><header class="top"><div><div class="icon">🌿</div><div class="eyebrow">Owner access</div><div class="title">Owner Operations Console</div><div class="muted">Medical cannabis system · TEST DATA ONLY</div></div><span class="badge warn">Review required</span></header><nav id="nav"></nav><main id="app"></main></div><script>const K='mcs_owner';let d=JSON.parse(localStorage.getItem(K)||'null')||{stock:[['CBD 10:10 10ml','CBD-2611',18],['Dried flower 2g','FL-2610',0],['Topical balm 30g','TB-2609',7]],sales:[['2026-11-07','CBD 10:10 10ml',2,240,'Nandi M.']],employees:[['Nandi Mokoena','Dispensary associate',32],['Thabo Khumalo','Responsible pharmacist',24]],requests:[['Nandi Mokoena','Extra shift','2026-11-14','Pending']],docs:[['Operating licence / authorisation','Review required'],['Responsible pharmacist registration','Evidence required'],['POPIA information officer record','Open']]};let tab='Overview';const tabs=['Overview','Stock & Sales','Employees','Schedule','Documents & Law'];function save(){localStorage.setItem(K,JSON.stringify(d));render()}function nav(){document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${tab===x?'on':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}function table(head,rows){return `<div class="scroll"><table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`}function render(){nav();let v=document.querySelector('#app');if(tab==='Overview'){let units=d.stock.reduce((a,x)=>a+x[2],0),sales=d.sales.reduce((a,x)=>a+x[3],0);v.innerHTML=`<div class="grid"><div class="card"><div class="muted">UNITS ON HAND</div><div class="big">${units}</div></div><div class="card"><div class="muted">RECORDED SALES</div><div class="big">R ${sales}</div></div><div class="card"><div class="muted">EMPLOYEES</div><div class="big">${d.employees.length}</div></div><div class="card"><div class="muted">OPEN REQUESTS</div><div class="big">${d.requests.filter(x=>x[3]==='Pending').length}</div></div></div><div class="card"><div class="section">CONTROL CENTRE</div><p class="muted">Manage stock, staff, schedules and evidence from the tabs above.</p><span class="badge">Offline mobile copy · saved on this device</span></div><div class="card"><b>Safety status</b><p class="muted">No live patient, payment or medical records. Software does not establish legal compliance.</p></div>`}else if(tab==='Stock & Sales'){v.innerHTML=`<div class="section">STOCK TRACKER</div><div class="card">${table(['Product','Batch','Qty'],d.stock.map(x=>[x[0],x[1],x[2]?(x[2]+' Available'):'Sold out']))}</div><div class="card"><div class="section">RECORD TEST SALE</div><form id="sale"><select name="p">${d.stock.filter(x=>x[2]).map(x=>`<option>${x[0]}</option>`)}</select><input name="q" type="number" min="1" placeholder="Quantity" required><input name="value" type="number" placeholder="Value (R)" required><input name="e" placeholder="Employee" required><button class="primary">Save sale</button></form></div><div class="card">${table(['Date','Product','Qty','Value','Employee'],d.sales)}</div>`;document.querySelector('#sale').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),i=d.stock.findIndex(x=>x[0]===f.get('p')),q=+f.get('q');if(i<0||d.stock[i][2]<q)return alert('Insufficient test stock');d.stock[i][2]-=q;d.sales.unshift([new Date().toISOString().slice(0,10),f.get('p'),q,+f.get('value'),f.get('e')]);save()}}else if(tab==='Employees'){v.innerHTML=`<div class="card">${table(['Name','Role','Hours/week'],d.employees)}</div><div class="card"><div class="section">ADD TEST EMPLOYEE</div><form id="emp"><input name="n" placeholder="Name and surname" required><input name="r" placeholder="Role" required><input name="h" type="number" placeholder="Hours/week" required><button class="primary">Add employee</button></form></div>`;document.querySelector('#emp').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);d.employees.push([f.get('n'),f.get('r'),+f.get('h')]);save()}}else if(tab==='Schedule'){v.innerHTML=`<div class="card">${table(['Employee','Request','Date','Status'],d.requests)}<button class="primary" onclick="d.requests.forEach(x=>x[3]='Approved');save()">Approve pending requests</button></div>`}else{v.innerHTML=`<div class="card"><p class="muted">Source-linked register; not legal advice or proof of compliance.</p>${table(['Requirement','Status'],d.docs)}</div>`}}render();</script></body></html>
